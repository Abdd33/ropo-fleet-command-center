.revision-dashboard .main-grid{grid-template-columns:minmax(0,22fr) minmax(0,50fr) minmax(0,28fr)}
.revision-dashboard .left-column{display:flex;flex-direction:column;gap:24px;padding-right:20px}
.revision-dashboard .right-column{display:grid;grid-template-rows:auto minmax(0,1fr);gap:20px;padding-left:20px}

.revision-dashboard .map-selection .selection-data{margin-left:auto}

.field-total{display:flex;align-items:baseline;gap:8px;padding:0;text-align:left}
.field-total strong{font-size:72px;line-height:1;font-weight:500;letter-spacing:-3px;font-variant-numeric:tabular-nums}
.field-total>span{font-size:12px;color:#7e8794}

.online-number strong{font-size:23px;line-height:1.2;color:#a9c7b8;font-weight:500;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.online-number small{font-size:11px;margin-left:2px}
.vehicle-field{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:12px;padding:8px 0 10px}
.vehicle-dot{aspect-ratio:1;border:1px solid transparent;padding:3px;border-radius:6px;display:grid;place-items:center;min-width:0;transition:opacity .18s,border-color .18s,background .18s}
.vehicle-dot>span{display:block;width:100%;height:100%;border-radius:4px;background:var(--vehicle-color);opacity:.9;transition:opacity .18s,transform .18s}
.vehicle-dot:hover,.vehicle-dot:focus-visible{border-color:var(--vehicle-color);background:#ffffff05}
.vehicle-dot:hover>span{transform:scale(.85)}
.vehicle-dot.dim{opacity:.15}
.field-context{height:38px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:10px;color:#7f8999;white-space:nowrap}
.field-context [role=tooltip]{font-size:10px;color:#c8c4dd;overflow:hidden;text-overflow:ellipsis}
.clear-filter{color:#a69bcd;display:flex;align-items:center;gap:4px;font-size:9px;flex-shrink:0;padding:4px 0}
.field-categories{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;padding-top:8px;border-top:1px solid #252b32}
.field-categories button{display:flex;align-items:center;gap:7px;padding:10px 8px;border:1px solid transparent;border-radius:5px;font-size:11px;color:#939eae;text-align:left}
.field-categories button:hover{background:#20242a}
.field-categories button.selected{background:#968bd511;border-color:#8072a455;color:#d0c8e5}
.field-categories i,.capacity-legend i,.capacity-tooltip i{width:6px;height:6px;border-radius:2px;display:inline-block;flex-shrink:0}
.field-categories strong{font-weight:500;color:#c9cdd5;margin-left:auto;font-size:13px;font-variant-numeric:tabular-nums}
.today-summary{position:relative;flex:1;min-height:240px;padding-top:24px;border-top:1px solid var(--line);touch-action:none;user-select:none;border-radius:0;transition:border-color .2s,background .2s}
.today-summary.refreshed{border-color:#9b91c6;background:#a39bd505}
.summary-refresh{display:flex;align-items:center;gap:5px;color:#9195ad;font-size:10px;padding:5px 8px;border:1px solid #363944;border-radius:5px}
.summary-refresh:hover{background:#292a35;color:#c6bee1}
.summary-refresh.refreshing{opacity:.6}
.today-metric{position:relative;padding:25px 0 21px;border-bottom:1px solid #262c34}
.today-metric:last-of-type{border-bottom:0}
.today-metric .metric-label{font-size:11px;color:#8994a5}
.today-metric .metric-body{margin-top:10px;gap:8px}
.today-metric .metric-body strong{font-size:35px;line-height:1.1;font-weight:500;font-variant-numeric:tabular-nums}
.today-metric .metric-body strong small{font-size:11px;color:#798596;margin-left:7px}
.today-metric .spark{width:85px;height:30px}
.today-metric .delta{top:26px;font-size:10px}
.summary-updated{display:flex;align-items:center;gap:6px;font-size:9px;color:#657485;margin-top:14px;min-height:18px}
.pull-indicator{position:absolute;top:43px;left:48%;color:#a39bd5;pointer-events:none;transition:opacity .15s}
.pull-ready{margin-left:auto;color:#a398c8;font-size:9px}
.revision-dashboard .left-foot{margin-top:auto;padding:0;font-size:9px;gap:5px;color:#677484}

    await script('ECharts',mirrors('echarts@6.0.0/dist/echarts.min.js'),()=>!!window.echarts?.init);

    await script('MapLibre',mirrors('maplibre-gl@5.14.0/dist/maplibre-gl.js'),()=>!!window.maplibregl?.Map,true);
    if(!mapCss)window.maplibregl=undefined;

    document.getElementById('root').textContent='';

    window.ROPO_CDN_REPORT.error=String(error);

})();</script></body></html>

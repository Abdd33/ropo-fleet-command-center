<script>
(async function(){
  const status=document.getElementById('load-status');
  window.ROPO_CDN_REPORT={startedAt:new Date().toISOString(),protocol:location.protocol,dependencies:[]};
  const mirrors=p=>['https://cdn.jsdelivr.net/npm/'+p,'https://unpkg.com/'+p];
  async function script(name,paths,check,optional=false){
    if(check())return;
    status.textContent='正在加载 '+name+'…';
    for(const url of paths){
      try{
        await new Promise((resolve,reject)=>{const el=document.createElement('script');el.src=url;el.async=true;let done=false;const finish=err=>{if(done)return;done=true;clearTimeout(timer);el.onload=null;el.onerror=null;if(err){el.remove();reject(err)}else resolve()};const timer=setTimeout(()=>finish(new Error('timeout')),15000);el.onload=()=>finish();el.onerror=()=>finish(new Error('network'));document.head.appendChild(el)});
        if(!check())throw new Error('missing browser global');
        window.ROPO_CDN_REPORT.dependencies.push({name,url,loaded:true});return;
      }catch(error){window.ROPO_CDN_REPORT.dependencies.push({name,url,loaded:false,reason:String(error)})}
    }
    if(!optional)throw new Error(name+' 加载失败');
  }
  async function style(){
    for(const url of mirrors('maplibre-gl@5.14.0/dist/maplibre-gl.css')){
      try{await new Promise((resolve,reject)=>{const el=document.createElement('link');el.rel='stylesheet';el.href=url;const timer=setTimeout(()=>{el.remove();reject(new Error('timeout'))},10000);el.onload=()=>{clearTimeout(timer);resolve()};el.onerror=()=>{clearTimeout(timer);el.remove();reject(new Error('network'))};document.head.appendChild(el)});return true}catch{}
    }
    return false;
  }
  try{
    await script('React',mirrors('react@18.3.1/umd/react.production.min.js'),()=>!!window.React);
    window.react=window.React; // Lucide UMD expects lowercase react.
    await script('ReactDOM',mirrors('react-dom@18.3.1/umd/react-dom.production.min.js'),()=>!!window.ReactDOM?.createRoot);
    await script('Lucide',mirrors('lucide-react@0.468.0/dist/umd/lucide-react.js'),()=>!!window.LucideReact?.CarFront);
    await script('ECharts',mirrors('echarts@6.0.0/dist/echarts.min.js'),()=>!!window.echarts?.init);
    const mapCss=await style();
    await script('MapLibre',mirrors('maplibre-gl@5.14.0/dist/maplibre-gl.js'),()=>!!window.maplibregl?.Map,true);
    if(!mapCss)window.maplibregl=undefined;
    window.ROPO_CDN_REPORT.ready=true;
    document.getElementById('root').textContent='';
    startRopo();
  }catch(error){
    window.ROPO_CDN_REPORT.error=String(error);
    document.querySelector('.boot-title').textContent='CDN 资源暂时无法加载';
    status.textContent=String(error.message)+'。请检查网络后重试。';
    document.getElementById('retry').hidden=false;
  }
})();</script></body></html>
